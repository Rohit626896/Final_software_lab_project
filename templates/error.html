{% extends "base.html" %}
{% block title %}
    {{ code }}
{% endblock %}
{% block content %}
    <section class="container section">
        <div class="empty-state">
            <span class="eyebrow">ERROR {{ code }}</span>
            <h1>{{ 'Page not found' if code == 404 else 'We couldn’t complete that request' }}</h1>
            <p>{{ message }}</p>
            <a class="button primary" href="{{ url_for('main.home') }}">Return home →</a>
        </div>
    </section>
{% endblock %}
